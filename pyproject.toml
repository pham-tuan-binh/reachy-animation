[project]
name = "reachy-animation"
version = "0.1.0"
description = "Real-time animation for Reachy Mini: speech-driven head sway and motion playback, one pose per frame"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/pham-tuan-binh/reachy-animation"

[project.optional-dependencies]
sim = [
    "mujoco==3.3.0",
    "reachy-mini>=1.10",
    "reachy-mini-rust-kinematics>=1.0.3",
    "imageio-ffmpeg>=0.5",
    "pillow>=10",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 119
extend-exclude = ["*.md"]

[tool.mypy]
strict = true
ignore_missing_imports = true
